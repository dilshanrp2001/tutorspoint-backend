# --- Enquiry (Phase 4.1) — AWAITING TRANSLATION ---
# These keys are deliberately absent rather than filled with English text. MessageSource
# falls back to messages.properties, so nothing breaks; leaving them out is what makes the
# gap visible to the key-set comparison in the 5.3 translation pass, which a copy of the
# English string would hide. Each needs a native speaker, not a guess:
#
#   notification.enquiry-received.subject
#   notification.enquiry-reply.subject
#   enquiry.contact-removed.phone
#   enquiry.contact-removed.email
#   validation.enquiry.tutor.required
#   validation.enquiry.subject.required
#   validation.enquiry.exam-level.required
#   validation.enquiry.format.required
#   validation.enquiry.code.size
#   validation.enquiry.message.required
#   validation.enquiry.message.size
#   validation.shortlist.note.size
#
# The same applies to templates/notifications/{si,ta}/enquiry-received.html and
# enquiry-reply.html, which are absent for the same reason; NotificationTemplateRenderer
# logs the fallback to English.

# --- Admin (Phase 5.1) — ENGLISH ONLY BY DECISION, NOT A TRANSLATION GAP ---
# The validation.admin.* keys exist only in messages.properties. They are returned solely by
# /api/admin endpoints, whose screens are English-only for the pilot (development plan, 5.1),
# so MessageSource's fallback to English is the intended behaviour. Do not add them in the 5.3
# translation pass unless that decision changes.
