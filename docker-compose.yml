# Local development database. Credentials are read from .env (see .env.example)
# and must match the values application-dev.yml resolves.
services:
  postgres:
    image: postgres:16
    container_name: tutorspoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - tutorspoint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tutorspoint_pgdata:
    name: tutorspoint_pgdata
