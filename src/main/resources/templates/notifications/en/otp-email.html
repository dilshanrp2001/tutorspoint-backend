<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your verification code</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<div style="max-width:520px;margin:0 auto;padding:32px;background:#ffffff;border-radius:8px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px;border-collapse:collapse;">
        <tr>
            <td style="padding:0 10px 0 0;vertical-align:middle;"><img src="cid:tutorspoint-logo" width="40" height="40" alt="" style="display:block;border:0;"></td>
            <td style="vertical-align:middle;"><h1 style="margin:0;font-size:20px;">TutorsPoint</h1></td>
        </tr>
    </table>
    <p>Hello <span th:text="${fullName}">there</span>,</p>
    <p>Use this code to finish verifying your TutorsPoint account.</p>
    <p style="margin:28px 0;font-size:32px;font-weight:bold;letter-spacing:6px;color:#1d4ed8;"
       th:text="${code}">000000</p>
    <p>The code expires in <span th:text="${expiryMinutes}">5</span> minutes.</p>
    <p style="font-size:13px;color:#52606d;">Do not share this code with anyone. If you did not ask for it, ignore this email.</p>
</div>
</body>
</html>
