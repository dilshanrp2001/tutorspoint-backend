# Profile-agnostic configuration. Anything environment-specific or secret lives in
# application-dev.yml / application-prod.yml and is read from environment variables.
spring:
  application:
    name: tutorspoint-backend
  profiles:
    default: dev

  jpa:
    # NEVER 'update'. The schema is owned by Flyway migrations; Hibernate only checks
    # that the entities match the migrated schema.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  # Translatable text resolved from messages*.properties. English (messages.properties)
  # is the fallback; the machine's locale must never decide what a user is sent.
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # Pool behind @Async. Notifications run here, off the request thread.
  task:
    execution:
      thread-name-prefix: tp-async-
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 100

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      # The container's ceiling. Each upload has its own, lower limit in StorageArea; this
      # one exists so an oversized body is refused before it is read into memory at all.
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

# Actuator: only health and info are exposed. Nothing else — env, beans, mappings and
# heapdump leak configuration and secrets.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # The mail indicator opens an SMTP connection on every probe. Notifications are
    # fire-and-forget by design, so a mail outage must not report the application as
    # DOWN and have the platform pull it out of rotation.
    mail:
      enabled: false
  info:
    env:
      enabled: false

# Swagger UI at /swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Auth policy. Not secrets and not environment-specific, so the values live here; the
# signing key and the database credentials come from the environment (see the dev/prod files).
tutorspoint:
  security:
    jwt:
      issuer: tutorspoint
      # Short, because nothing can revoke an access token before it expires. The client
      # refreshes silently; the user notices nothing.
      access-token-ttl: 15m
      # Long, because this is what keeps a user signed in — and it is revocable, rotated on
      # every use, and stored only as a digest.
      refresh-token-ttl: 30d
  auth:
    email-verification-ttl: 24h
    password-reset-ttl: 30m
    otp-ttl: 5m
    # Every SMS costs money (see the cost note in the development plan).
    max-otp-sends-per-hour: 3
    # The emailed links point at frontend pages, which post the token to the API. A token in
    # a GET query string would end up in browser history and proxy logs.
    verify-email-url: ${FRONTEND_BASE_URL:http://localhost:5173}/verify-email
    reset-password-url: ${FRONTEND_BASE_URL:http://localhost:5173}/reset-password

logging:
  level:
    com.tutorspoint: INFO
