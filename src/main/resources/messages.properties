# Default bundle. English is the platform fallback (Language.EN) and is also what any
# locale without its own bundle resolves to. Sinhala and Tamil live in messages_si and
# messages_ta. Read as UTF-8 (spring.messages.encoding), so no \uXXXX escaping.

notification.email-verification.subject=Verify your TutorsPoint email address
notification.password-reset.subject=Reset your TutorsPoint password

# --- Validation messages (auth) ---
# Referenced from request DTOs as {key}; Spring resolves them through this bundle, so a
# rejected field is explained in the caller's language rather than in hardcoded English.
validation.email.required=Email address is required
validation.email.invalid=Enter a valid email address
validation.password.required=Password is required
validation.password.size=Password must be between 8 and 72 characters
validation.password.weak=Password must contain at least one letter and one number
validation.full-name.required=Full name is required
validation.full-name.size=Full name must be at most 150 characters
validation.phone.required=Phone number is required
validation.phone.invalid=Enter the phone number in international format, for example +94771234567
validation.role.required=Choose whether you are registering as a tutor or a parent
validation.language.required=Preferred language is required
validation.token.required=The link is incomplete or has been altered
validation.otp.required=Verification code is required
validation.otp.invalid=Enter the 6-digit verification code
validation.refresh-token.required=Refresh token is required
validation.child.name.required=Child name is required
validation.child.name.size=Child name must be at most 150 characters
validation.child.grade.required=Grade is required
validation.child.exam-level.required=Exam level is required
validation.child.school.size=School name must be at most 200 characters
validation.child.notes.size=Notes must be at most 1000 characters

# --- Validation messages (tutor profile) ---
# A draft is a half-filled form by definition, so almost nothing here is "required":
# these check only what a request body can be judged on. What a profile needs before it
# can be published is TutorProfile.publish(), and the client is told which fields through
# missingFields, not through a validation message.
validation.profile.headline.size=Headline must be at most 200 characters
validation.profile.bio.size=About you must be at most 5000 characters
validation.profile.subjects.size=Choose at most 30 subjects
validation.profile.qualifications.size=Add at most 20 qualifications
validation.profile.years-of-experience.range=Years of experience must be between 0 and 70
validation.profile.fee.range=Enter the fee as a positive amount in rupees
validation.profile.travel-radius.range=Travel radius must be between 0 and 200 kilometres
validation.profile.availability-status.required=Choose whether you are accepting new students
validation.qualification.title.required=Qualification title is required
validation.qualification.title.size=Qualification title must be at most 200 characters
validation.qualification.institution.required=Institution is required
validation.qualification.institution.size=Institution must be at most 200 characters
validation.qualification.year.required=Year awarded is required
validation.qualification.year.range=Enter the year the qualification was awarded

# --- Validation messages (search) ---
validation.search.code.size=A filter value must be at most 60 characters
validation.search.fee.range=Enter the fee as a positive amount in rupees
validation.search.fee.order=The minimum fee must not be more than the maximum fee
validation.search.rating.range=Minimum rating must be between 0 and 5
validation.search.keyword.size=Search text must be at most 100 characters
validation.search.sort.unsupported=Sort by relevance, price_asc, rating_desc, experience_desc or distance_asc
validation.search.distance.area-required=Choose an area to sort by distance
validation.search.page.range=Page must be between 0 and 500
validation.search.size.range=Results per page must be between 1 and 50

# --- Reference data: the enum-backed lists (Medium, ClassFormat) ---
# Subjects, exam levels, syllabuses and areas are translated in their own tables; these two
# are closed sets with no table, so their display names live here instead.
reference.medium.SINHALA=Sinhala
reference.medium.TAMIL=Tamil
reference.medium.ENGLISH=English
reference.class-format.ONE_TO_ONE=One-to-one
reference.class-format.SMALL_GROUP=Small group
reference.class-format.MASS_CLASS=Mass class
reference.class-format.ONLINE=Online
